name: Daily System Heartbeat

on:
  schedule:
    # 每天 UTC 04:00
    - cron: '0 4 * * *'
  workflow_dispatch: # 允许手动点按钮触发测试

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name 'Cyberchopin'
          git config user.email '181143010+Cyberchopin@users.noreply.github.com'

      - name: Record 10 Heartbeats and Push
        run: |
          mkdir -p logs
          for i in {1..10}; do
            echo "System heartbeat #$i active at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> logs/heartbeat.log
            git add logs/heartbeat.log
            git commit -m "chore(telemetry): record system heartbeat #$i [skip ci]" || true
            sleep 1
          done
          git push
